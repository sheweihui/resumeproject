services:
  mysql:
    image: mysql:8.0
    container_name: wordflash-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordflash
      MYSQL_USER: wordflash
      MYSQL_PASSWORD: wordflash
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: wordflash-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass wordflash
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "wordflash", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wordflash-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: wordflash
      RABBITMQ_DEFAULT_PASS: wordflash
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent:
    build:
      context: ./ai-agent
    container_name: wordflash-ai-agent
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://host.docker.internal:8080
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
